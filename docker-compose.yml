services:
  susana:
    image: ghcr.io/doctorniz/susana:latest
    build: .
    container_name: susana
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - ./config:/config:ro
      # For the "host" integration: read-only views of the host.
      - /proc:/host/proc:ro
      - /:/host/root:ro
    env_file:
      - .env

  # For the "docker" integration. Only lets Susana list containers, nothing else.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: susana-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
